<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 Housing Bills Tracker — SANDAG / Ascent</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #F7F6F3; color: #1a1a18; font-size: 14px; line-height: 1.5; }

  header {
    background: #1D3557; color: #fff; padding: 20px 32px 16px;
    border-bottom: 3px solid #457B9D; display: flex;
    align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  }
  header h1 { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
  .header-sub { font-size: 12px; color: #A8C4D8; margin-top: 4px; }

  .sync-status { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #A8C4D8; flex-shrink: 0; padding-top: 2px; }
  .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: #A8C4D8; flex-shrink: 0; transition: background 0.3s; }
  .sync-dot.syncing { background: #F4D03F; animation: pulse 1s infinite; }
  .sync-dot.ok      { background: #58D68D; }
  .sync-dot.error   { background: #EC7063; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  .refresh-btn {
    font-size: 11px; padding: 3px 10px; border-radius: 999px;
    border: 0.5px solid #457B9D; background: transparent; color: #A8C4D8;
    cursor: pointer; transition: all 0.15s; white-space: nowrap;
  }
  .refresh-btn:hover { background: #457B9D; color: #fff; }
  .refresh-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .toolbar {
    background: #fff; border-bottom: 0.5px solid #ddd; padding: 12px 32px;
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    position: sticky; top: 0; z-index: 10;
  }
  .search-wrap { position: relative; flex: 1; min-width: 180px; max-width: 280px; }
  .search-wrap input {
    width: 100%; padding: 6px 10px 6px 30px; border: 0.5px solid #ccc;
    border-radius: 6px; font-size: 13px; background: #fafafa; outline: none;
  }
  .search-wrap input:focus { border-color: #457B9D; background: #fff; }
  .search-wrap svg { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; stroke: #999; fill: none; }

  .filter-group { display: flex; flex-wrap: wrap; gap: 5px; }
  .fbtn {
    font-size: 12px; padding: 4px 11px; border-radius: 999px;
    border: 0.5px solid #ccc; background: #fff; color: #555;
    cursor: pointer; transition: all 0.12s; white-space: nowrap;
  }
  .fbtn:hover { border-color: #457B9D; color: #1D3557; }
  .fbtn.on { background: #1D3557; color: #fff; border-color: #1D3557; font-weight: 500; }
  .toolbar-divider { width: 0.5px; height: 22px; background: #e0ddd7; flex-shrink: 0; }

  .stats-bar { background: #fff; padding: 10px 32px; border-bottom: 0.5px solid #eee; display: flex; flex-wrap: wrap; gap: 24px; }
  .stat { display: flex; flex-direction: column; }
  .stat-n { font-size: 20px; font-weight: 600; color: #1D3557; line-height: 1; }
  .stat-l { font-size: 11px; color: #888; margin-top: 2px; }

  .count-bar { padding: 8px 32px; font-size: 12px; color: #888; background: #F7F6F3; border-bottom: 0.5px solid #eee; }
  .bill-list { padding: 12px 24px 40px; }

  .bill-card {
    background: #fff; border: 0.5px solid #e0ddd7; border-radius: 8px;
    margin-bottom: 6px; padding: 12px 14px;
    display: grid; grid-template-columns: 80px 1fr auto; gap: 10px 14px; align-items: start;
  }
  .bill-card.is-inactive { opacity: 0.6; }
  .bill-card.not-sandag  { border-left: 3px solid #c8a45a; }
  .bill-card.live-changed { border-color: #58D68D; }

  .bill-id   { font-weight: 600; font-size: 13px; color: #1D3557; white-space: nowrap; padding-top: 2px; }
  .bill-main { display: flex; flex-direction: column; gap: 5px; }
  .bill-top  { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .bill-subj { font-size: 13px; font-weight: 500; color: #1a1a18; }
  .bill-subj.inactive-subj { text-decoration: line-through; color: #999; }
  .bill-desc { font-size: 12.5px; color: #555; line-height: 1.6; }
  .bill-desc.no-desc { color: #aaa; font-style: italic; }

  .live-row  { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; font-size: 12px; }
  .live-pill { font-size: 10px; background: #E1F5EE; color: #085041; padding: 1px 6px; border-radius: 3px; font-weight: 700; letter-spacing: 0.04em; flex-shrink: 0; }
  .live-stage { color: #1D3557; font-weight: 500; }
  .live-date  { color: #999; font-size: 11px; }
  .live-link  { font-size: 11px; color: #457B9D; text-decoration: none; }
  .live-link:hover { text-decoration: underline; }

  .bill-badges { display: flex; flex-direction: column; gap: 5px; align-items: flex-end; }
  .badge { display: inline-block; font-size: 11px; padding: 2px 9px; border-radius: 999px; white-space: nowrap; line-height: 1.6; }
  .b-senate    { background: #EEEDFE; color: #3C3489; }
  .b-assembly  { background: #EAF3DE; color: #3B6D11; }
  .b-floor     { background: #D6EAF8; color: #1a5276; }
  .b-committee { background: #F1EFE8; color: #5F5E5A; }
  .b-pending   { background: #FEF9E7; color: #7D6608; }
  .b-inactive  { background: #FDEDEC; color: #922B21; }
  .b-passed    { background: #D5F5E3; color: #1E8449; }
  .b-notsandag { background: #FDF3E3; color: #7D5A1E; }
  .b-signed    { background: #D5F5E3; color: #145A32; }
  .b-vetoed    { background: #FDEDEC; color: #7B241C; }
  .b-engrossed { background: #D6EAF8; color: #154360; }

  .cat { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 4px; white-space: nowrap; line-height: 1.7; font-weight: 500; }
  .cat-sb79       { background: #E1F5EE; color: #085041; }
  .cat-density    { background: #EEEDFE; color: #3C3489; }
  .cat-streamline { background: #E6F1FB; color: #0C447C; }
  .cat-adu        { background: #FEF9E7; color: #7D4E0A; }
  .cat-rhna       { background: #F0EAF8; color: #5A2D82; }
  .cat-funding    { background: #D5F5E3; color: #1E6B3C; }
  .cat-other      { background: #F1EFE8; color: #4A4840; }
  .cat-unknown    { background: #F7F6F3; color: #999; border: 0.5px solid #ddd; }

  /* ── Hearing ── */
  .hearing-row { display: flex; align-items: center; gap: 6px; font-size: 12px; flex-wrap: wrap; }
  .hearing-pill { font-size: 10px; padding: 1px 6px; border-radius: 3px; font-weight: 700; letter-spacing: 0.04em; flex-shrink: 0; }
  .hearing-pill.soon   { background: #FEF3C7; color: #92400E; }
  .hearing-pill.today  { background: #FEE2E2; color: #991B1B; }
  .hearing-pill.future { background: #EDE9FE; color: #4C1D95; }
  .hearing-date { color: #555; font-weight: 500; }
  .hearing-cmte { color: #888; font-size: 11px; }

  /* ── Comments ── */
  .comments-section { margin-top: 6px; }
  .comments-log { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
  .comment-entry { background: #FFFBEB; border-left: 3px solid #F59E0B; border-radius: 0 4px 4px 0; padding: 6px 10px; }
  .comment-meta { display: flex; align-items: center; gap: 8px; font-size: 11px; color: #999; margin-bottom: 3px; }
  .comment-author { font-weight: 600; color: #1D3557; }
  .comment-ts { color: #bbb; }
  .comment-delete { margin-left: auto; font-size: 11px; color: #ddd; background: none; border: none; cursor: pointer; padding: 0; line-height: 1; }
  .comment-delete:hover { color: #e53e3e; }
  .comment-text { font-size: 12.5px; color: #444; line-height: 1.55; white-space: pre-wrap; }
  .comment-composer { display: flex; flex-direction: column; gap: 5px; }
  .comment-add-btn { font-size: 12px; color: #bbb; background: none; border: 0.5px solid #e0ddd7; border-radius: 4px; padding: 5px 10px; cursor: pointer; text-align: left; font-family: inherit; transition: all 0.12s; }
  .comment-add-btn:hover { border-color: #F59E0B; color: #92400E; background: #FFFBEB; }
  .comment-textarea { width: 100%; font-size: 12.5px; font-family: inherit; border: 0.5px solid #457B9D; border-radius: 4px; padding: 6px 8px; resize: vertical; min-height: 56px; outline: none; background: #fff; line-height: 1.55; }
  .comment-actions { display: flex; gap: 6px; align-items: center; }
  .comment-post, .comment-cancel-btn { font-size: 11px; padding: 4px 12px; border-radius: 4px; border: none; cursor: pointer; font-family: inherit; }
  .comment-post { background: #1D3557; color: #fff; }
  .comment-post:hover { background: #457B9D; }
  .comment-cancel-btn { background: #f0ede8; color: #555; }
  .note-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #F59E0B; margin-left: 4px; vertical-align: middle; }

  .no-results { padding: 40px 32px; text-align: center; color: #999; font-size: 14px; }

  @media (max-width: 640px) {
    header, .toolbar, .stats-bar, .count-bar, .bill-list { padding-left: 16px; padding-right: 16px; }
    .bill-card { grid-template-columns: 60px 1fr; }
    .bill-badges { flex-direction: row; flex-wrap: wrap; justify-content: flex-start; }
    .toolbar-divider { display: none; }
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>2026 California Housing Bills Tracker</h1>
    <div class="header-sub">Sources: SANDAG (June 10, 2026) &amp; Ascent &nbsp;·&nbsp; Amber border = not in SANDAG &nbsp;·&nbsp; Live status via LegiScan · refreshes daily at 3 AM</div>
  </div>
  <div class="sync-status">
    <span class="sync-dot" id="sync-dot"></span>
    <span id="sync-label">Checking cache…</span>
    <button class="refresh-btn" id="refresh-btn" onclick="forceRefresh()">↻ Refresh</button>
  </div>
</header>

<div class="toolbar">
  <div class="search-wrap">
    <svg viewBox="0 0 24 24" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" id="search" placeholder="Search bills, subjects, descriptions…" autocomplete="off">
  </div>
  <div class="toolbar-divider"></div>
  <div class="filter-group" id="status-filters"></div>
  <div class="toolbar-divider"></div>
  <div class="filter-group" id="cat-filters"></div>
</div>

<div class="stats-bar" id="stats-bar"></div>
<div class="count-bar"  id="count-bar"></div>
<div class="bill-list"  id="bill-list"></div>

<script>
// ── Config ────────────────────────────────────────────────────────────────────
const LEGISCAN_KEY = "e1b55064872be319c9599280021f5184";
const CACHE_KEY    = "hsng_bills_legiscan_v7";
const NOTES_KEY    = "hsng_bills_comments_v1";
const HEARING_KEY  = "hsng_bills_hearings_v1";
const CACHE_TTL_MS = 24 * 60 * 60 * 1000;

// LegiScan progress codes
const PROGRESS = {
  0:  { label: "Pre-Filed",    cls: "b-pending"   },
  1:  { label: "Introduced",   cls: "b-committee" },
  2:  { label: "Engrossed",    cls: "b-engrossed" },
  3:  { label: "Enrolled",     cls: "b-engrossed" },
  4:  { label: "Passed",       cls: "b-passed"    },
  5:  { label: "Vetoed",       cls: "b-vetoed"    },
  6:  { label: "Failed",       cls: "b-inactive"  },
  7:  { label: "Overridden",   cls: "b-passed"    },
  8:  { label: "Chaptered",    cls: "b-signed"    },
  9:  { label: "Refer",        cls: "b-pending"   },
  10: { label: "In Committee", cls: "b-committee" },
  11: { label: "In Committee", cls: "b-floor"     },
  12: { label: "Signed",       cls: "b-signed"    },
  13: { label: "Dead",         cls: "b-inactive"  },
};

// ── Categories ────────────────────────────────────────────────────────────────
const CAT = {
  SB79:    { label: "SB 79",                   cls: "cat-sb79"       },
  DENSITY: { label: "Density Bonus",           cls: "cat-density"    },
  STREAM:  { label: "Streamlining",            cls: "cat-streamline" },
  ADU:     { label: "ADUs / JADUs",            cls: "cat-adu"        },
  RHNA:    { label: "RHNA / Housing Elements", cls: "cat-rhna"       },
  FUNDING: { label: "Funding",                 cls: "cat-funding"    },
  OTHER:   { label: "Other",                   cls: "cat-other"      },
  UNKNOWN: { label: "Not in SANDAG",           cls: "cat-unknown"    },
};

// ── Bill data ─────────────────────────────────────────────────────────────────
const bills = [
  { id:"AB-11",   subj:"The Social Housing Act",                                                         chamber:"Assembly", stage:"In Committee – Housing",                          sandag:"Inactive", cat:"OTHER",    desc:"Would create the California Housing Authority as an independent state body to develop, own, and operate social housing across the state." },
  { id:"AB-748",  subj:"Preapproved housing plans: single-family and multifamily",                       chamber:"Senate",   stage:"In Committee – Housing",                          sandag:"Active",   cat:"STREAM",   desc:"Would require local agencies to develop a preapproval program for single-family and multifamily residential housing plans – large jurisdictions by July 1, 2027, small jurisdictions by January 1, 2029. Applications using preapproved plans on qualifying lots must be approved or denied ministerially within 30 days and are exempt from CEQA." },
  { id:"AB-939",  subj:"Density bonus: affordability of for-sale units",                                 chamber:"Senate",   stage:"In Committee – Appropriations",                   sandag:"Active",   cat:"DENSITY",  desc:"Would add a third compliance option for density bonus for-sale unit affordability requirements: a unit may be purchased by a nonprofit corporation for resale to extremely low, very low, or lower income families participating in a below-market interest rate loan program, as defined." },
  { id:"AB-956",  subj:"ADUs: CID restrictions and second detached ADU on SFR lots",                     chamber:"Assembly", stage:"In Committee – Housing",                          sandag:"Active",   cat:"ADU",      desc:"Would prohibit common interest developments from enforcing restrictions that effectively prohibit or unreasonably restrict ADUs or JADUs and would increase the number of detached new construction ADUs that a local agency must ministerially approve on single-family lots from one to two." },
  { id:"AB-1070", subj:"HCD working group: small multifamily under California Residential Code",         chamber:"Assembly", stage:"In Committee – Housing",                          sandag:"Active",   cat:"OTHER",    desc:"Would direct HCD to convene a working group to consider allowing small multi-family (3 to 10-unit) residential developments to be built under the California Residential Code (CRC) rather than the California Building Code." },
  { id:"AB-1294", subj:"Housing entitlement applications: completeness and standardization",             chamber:"Senate",   stage:"In Committee – Housing",                          sandag:"Active",   cat:"STREAM",   desc:"Would require cities and counties to deem an application for a housing development entitlement complete once the applicant submits specified information, and directs HCD to develop a standardized housing entitlement application that cities and counties must accept." },
  { id:"AB-1567", subj:"General plan: annual report: congregate and residential care for the elderly",   chamber:"Senate",   stage:"In Committee – Appropriations",                   sandag:"Active",   cat:"RHNA",     desc:"Would allow up to 15% of RHNA credits to come from elderly congregate/residential care facilities starting in the 7th cycle." },
  { id:"AB-1573", subj:"Land use: housing elements: target population",                                  chamber:"Senate",   stage:"Floor – Third Reading",                           sandag:"Active",   cat:"RHNA",     desc:"Would expand \"target population\" in housing element law to include victims of domestic violence, sexual assault, and human trafficking." },
  { id:"AB-1621", subj:"Post-entitlement permits: plan check rounds and HAA violations",                 chamber:"Senate",   stage:"In Committee – Housing",                          sandag:"Active",   cat:"STREAM",   desc:"Would limit building permit plan check reviews to 2 rounds, shorten appeal timelines, and tie violations of post-entitlement permit requirements to the Housing Accountability Act (HAA)." },
  { id:"AB-1623", subj:"RHNA and annual report: student housing quarters",                               chamber:"Assembly", stage:"In Committee – Housing and Community Development", sandag:"Inactive", cat:"RHNA",     desc:"Would allow certain student housing quarters to count toward a jurisdiction's lower-income RHNA progress, and require jurisdictions to report those units by income category in the annual progress report." },
  { id:"AB-1708", subj:"HHAP round 8: smaller jurisdictions",                                            chamber:"Assembly", stage:"In Committee – Appropriations",                   sandag:"Inactive", cat:"FUNDING",  desc:"Would establish requirements for HHAP Round 8, including mandating a regional homelessness action plan and allowing funds to be allocated to smaller jurisdictions with compliant housing elements." },
  { id:"AB-1710", subj:"HAA: vesting provisions and Permit Streamlining Act",                            chamber:"Senate",   stage:"In Committee – Local Government",                  sandag:"Active",   cat:"STREAM",   desc:"Would expand vesting provisions of the HAA to include additional standards and extend the HAA's \"reasonable person\" consistency standard to the Permit Streamlining Act." },
  { id:"AB-1738", subj:"State Housing Law: remote inspections",                                          chamber:"Senate",   stage:"Floor – Second Reading",                          sandag:"Active",   cat:"STREAM",   desc:"Would require cities and counties to offer remote inspection options for specified work on one- and two-family dwellings by July 1, 2027." },
  { id:"AB-1740", subj:"Coastal resources: LCP: coastal development permits: Santa Monica",              chamber:"Senate",   stage:"In Committee – Natural Resources and Water",       sandag:null,       cat:"UNKNOWN",  desc:"Not included in the SANDAG June 2026 tracking document. Tracked in Ascent source only." },
  { id:"AB-1751", subj:"Missing Middle Townhome Ownership Act",                                          chamber:"Senate",   stage:"In Committee – Housing",                          sandag:"Active",   cat:"STREAM",   desc:"Would create ministerial approval for townhome projects up to 3 stories with streamlined subdivision map approval." },
  { id:"AB-1771", subj:"State Housing Law: apartment houses",                                            chamber:"Assembly", stage:"In Committee – Appropriations",                   sandag:"Inactive", cat:"OTHER",    desc:"Would require HCD to study and report on the effectiveness of the on-site manager requirement in apartment buildings with 16+ units." },
  { id:"AB-1903", subj:"Construction defect claim procedures: condos and townhouses",                    chamber:"Assembly", stage:"In Committee – Housing",                          sandag:"Active",   cat:"OTHER",    desc:"Would revise construction defect claim procedures for new condominium and townhouse developments, including expanding builder inspection rights, increasing the burden on homeowners to prove physical damage, and restricting certain HOA claims." },
  { id:"AB-1914", subj:"General plan elements: childcare",                                               chamber:"Senate",   stage:"In Committee – Human Services",                   sandag:"Active",   cat:"OTHER",    desc:"Would require cities and counties to prepare and adopt a childcare plan, or integrate one into the next general plan update, between January 1, 2028 and January 1, 2033." },
  { id:"AB-1997", subj:"Housing development approvals: timelines and processes",                         chamber:"Senate",   stage:"In Committee – Housing",                          sandag:"Active",   cat:"STREAM",   desc:"Would require local agencies to approve or disapprove certain housing projects within 30 days after EIR certification, if the project is at least 90% affordable and has applied for time-sensitive public funding." },
  { id:"AB-2002", subj:"Regional Early Action Planning Fund: codification",                              chamber:"Senate",   stage:"In Committee – Appropriations",                   sandag:"Active",   cat:"FUNDING",  desc:"Would codify the Regional Early Action Program (REAP) to provide grants to local jurisdictions for planning activities needed to meet the 7th and subsequent RHNA cycles." },
  { id:"AB-2005", subj:"SB 9 urban lot split: owner-occupancy modification",                             chamber:"Senate",   stage:"In Committee – Housing",                          sandag:"Active",   cat:"STREAM",   desc:"Would modify SB 9 urban lot split requirements to allow owner-occupancy to be satisfied either by the applicant or by requiring a subsequent homebuyer to occupy a unit for 3 years." },
  { id:"AB-2074", subj:"Regional transit hub districts: downtown housing by right",                      chamber:"Senate",   stage:"In Committee – Housing",                          sandag:"Active",   cat:"STREAM",   desc:"Would require cities with 400,000+ population and at least two TOD stops to designate regional transit hub districts where downtown housing is allowed by right, and establishes a state loan fund." },
  { id:"AB-2079", subj:"Adaptive Reuse Investment Incentive Program",                                    chamber:"Assembly", stage:"In Committee – Housing and Community Development", sandag:"Inactive", cat:"FUNDING",  desc:"Would expand the adaptive reuse investment incentive program to include all projects regardless of affordability or labor standards compliance, and broaden the use of property tax increment financing." },
  { id:"AB-2094", subj:"Social Housing Strategy and Implementation Program",                             chamber:"Assembly", stage:"In Committee – Appropriations",                   sandag:"Inactive", cat:"OTHER",    desc:"Would require HCD to establish a dedicated social housing coordinator to lead social housing strategy and implementation, including inventorying surplus public land." },
  { id:"AB-2118", subj:"AB 2011/SB 6: use by right: objective standards",                               chamber:"Senate",   stage:"In Committee – Local Government",                  sandag:"Active",   cat:"STREAM",   desc:"Would prohibit objective standards from restricting mixed-use development in AB 2011 (Affordable Housing and High Road Jobs Act) projects." },
  { id:"AB-2127", subj:"ADUs: private sewage disposal systems",                                          chamber:"Senate",   stage:"In Committee – Housing",                          sandag:"Active",   cat:"ADU",      desc:"Would prohibit local agencies from banning ADUs solely because lots are served by private sewage systems, and limit when local health officers can deny approval or require new/alternative systems." },
  { id:"AB-2146", subj:"Supportive housing: California DASH designation",                                chamber:"Senate",   stage:"In Committee – Housing",                          sandag:"Active",   cat:"OTHER",    desc:"Would establish the California Direct Access to Supportive Housing (DASH) designation to streamline tenant eligibility documentation and referrals for certain supportive housing units." },
  { id:"AB-2185", subj:"Affordable housing programs: factory built housing",                             chamber:"Senate",   stage:"In Committee – Housing",                          sandag:"Active",   cat:"FUNDING",  desc:"Would require state housing finance agencies to update guidelines by July 1, 2027 to allow factory built housing in major affordable housing programs." },
  { id:"AB-2252", subj:"Building standards: single-stair multifamily residential buildings",             chamber:"Assembly", stage:"In Committee – Housing and Community Development", sandag:"Inactive", cat:"OTHER",    desc:"Would require HCD to develop building standards for single-exit, single-stairway multifamily residential buildings up to 6 stories for the next triennial Building Standards Code update." },
  { id:"AB-2295", subj:"Regional housing need: jointly funded projects",                                 chamber:"Assembly", stage:"In Committee – Housing and Community Development", sandag:"Inactive", cat:"RHNA",     desc:"Would allow two local governments' jointly funded housing projects to count toward both jurisdictions' RHNA obligations." },
  { id:"AB-2296", subj:"Housing element and RHNA: procedural changes",                                   chamber:"Senate",   stage:"In Committee – Housing",                          sandag:"Active",   cat:"RHNA",     desc:"Would extend the window for subregional entity formation from 28 to 34 months before a housing element revision, and move up RHNA methodology development and draft allocation timelines by 6 months each." },
  { id:"AB-2351", subj:"General plan: annual report: shelter beds",                                      chamber:"Assembly", stage:"In Committee – Appropriations",                   sandag:"Inactive", cat:"RHNA",     desc:"Would require annual progress reports to include shelter bed counts by type beginning April 1, 2027." },
  { id:"AB-2390", subj:"SB 35/SB 423: streamlined approval modifications",                              chamber:"Senate",   stage:"In Committee – Local Government",                  sandag:"Active",   cat:"STREAM",   desc:"Would clarify that modification approvals under SB 35/SB 423 must be evaluated against objective standards in effect at original application, and extend the litigation-based approval validity period to all modification requests." },
  { id:"AB-2397", subj:"Community facilities districts: critical housing infrastructure",                chamber:"Senate",   stage:"In Committee – Housing",                          sandag:"Active",   cat:"FUNDING",  desc:"Would limit a local agency's ability to block a critical housing infrastructure district formed to finance facilities serving a housing project with lower- or moderate-income units." },

// ── Data stores ───────────────────────────────────────────────────────────────
let liveData    = {};
let notesData   = {};
let hearingData = {};
let billIdMap   = {};

// ── LegiScan API ──────────────────────────────────────────────────────────────
async function legiScanGet(params) {
  const qs = new URLSearchParams({ key: LEGISCAN_KEY, ...params });
  const resp = await fetch(`https://api.legiscan.com/?${qs}`);
  if (!resp.ok) throw new Error(`LegiScan HTTP ${resp.status}`);
  const data = await resp.json();
  if (data.status === "ERROR") throw new Error(data.alert?.message || "LegiScan API error");
  return data;
}

async function getCASessionId() {
  const data = await legiScanGet({ op: "getSessionList", state: "CA" });
  const sessions = data.sessions || [];
  const match =
    sessions.find(s => s.session_name && /2025.?2026/i.test(s.session_name) && /regular/i.test(s.session_name)) ||
    sessions.find(s => s.session_name && /2025.?2026/i.test(s.session_name)) ||
    sessions[0];
  if (!match) throw new Error("Could not find CA 2025-2026 session");
  return match.session_id;
}

async function syncAllBills(force = false) {
  try {
    const raw = localStorage.getItem(CACHE_KEY);
    if (!force && raw) {
      const cache = JSON.parse(raw);
      if (Date.now() - cache.timestamp < CACHE_TTL_MS) {
        liveData = cache.data;
        if (cache.billIdMap) billIdMap = cache.billIdMap;
        setSyncStatus("ok", `Live · updated ${formatAge(Date.now() - cache.timestamp)}`);
        rebuildStatusFilters();
        render();
        scheduleNextRefresh(CACHE_TTL_MS - (Date.now() - cache.timestamp));
        return;
      }
    }
  } catch(e) {}

  setSyncStatus("syncing", "Fetching session info…");
  document.getElementById("refresh-btn").disabled = true;

  try {
    const sessionId = await getCASessionId();
    setSyncStatus("syncing", "Fetching bill list from LegiScan…");

    const masterData = await legiScanGet({ op: "getMasterList", id: sessionId });

    // getMasterList returns { masterlist: { "0": {session_id,...}, "1": {bill_id, number,...}, ... } }
    // Key "0" is session metadata (no bill_id/number), numbered keys are bills
    const rawMaster = masterData.masterlist || masterData.bills || {};
    console.log("[LegiScan] getMasterList keys:", Object.keys(rawMaster).slice(0,5), "total:", Object.keys(rawMaster).length);

    const masterMap = {};
    Object.values(rawMaster).forEach(item => {
      if (item && typeof item === "object" && item.number) {
        // Store under the exact number as returned, uppercased
        masterMap[String(item.number).toUpperCase().trim()] = item;
      }
    });
    console.log("[LegiScan] masterMap entries:", Object.keys(masterMap).length);

    // Debug: log a few masterMap keys to understand format
    const sampleKeys = Object.keys(masterMap).slice(0, 10);
    console.log("[LegiScan] masterMap sample keys:", sampleKeys, "total:", Object.keys(masterMap).length);

    const results = {};
    bills.forEach(b => {
      // LegiScan format is "AB748", "SB1426" — no space, no padding
      const [type, num] = b.id.split("-");
      const key = `${type}${num}`.toUpperCase();
      const item = masterMap[key];

      if (item) {
        const prog = PROGRESS[item.progress] || { label: "In Committee", cls: "b-committee" };
        const status = statusFromAction(item.last_action, prog.label, prog.cls);
        results[b.id] = {
          label:          status.label,
          cls:            status.cls,
          lastAction:     item.last_action      || "",
          lastActionDate: item.last_action_date  || "",
          progress:       item.progress,
          url:            item.url               || "",
        };
        if (item.bill_id) billIdMap[b.id] = item.bill_id;
      } else {
        console.warn("[LegiScan] no match for", b.id, "tried:", key);
      }
    });

    liveData = results;
    const matched = Object.keys(results).length;
    console.log("[LegiScan] matched", matched, "of", bills.length, "bills");
    localStorage.setItem(CACHE_KEY, JSON.stringify({ timestamp: Date.now(), data: results, billIdMap }));
    setSyncStatus("ok", `Live · ${matched} of ${bills.length} bills matched`);
    rebuildStatusFilters();
    scheduleNextRefresh(CACHE_TTL_MS);
    await fetchAllHearings();

  } catch(err) {
    setSyncStatus("error", `Sync failed: ${err.message}`);
  }

  document.getElementById("refresh-btn").disabled = false;
  render();
}

function forceRefresh() {
  localStorage.removeItem(CACHE_KEY);
  localStorage.removeItem(HEARING_KEY);
  hearingData = {};
  billIdMap   = {};
  syncAllBills(true);
}

function scheduleNextRefresh(remainingMs) {
  const now   = new Date();
  const next3 = new Date(now);
  next3.setHours(3, 0, 0, 0);
  if (next3 <= now) next3.setDate(next3.getDate() + 1);
  setTimeout(() => syncAllBills(true), Math.min(remainingMs, next3 - now));
}

// ── Hearing fetch ─────────────────────────────────────────────────────────────
async function fetchHearing(billId) {
  if (hearingData.hasOwnProperty(billId)) return;
  try {
    const lsId = billIdMap[billId];
    if (!lsId) { hearingData[billId] = null; saveHearings(); return; }
    const data = await legiScanGet({ op: "getBill", id: lsId });
    const bill = data.bill || {};
    const hearings = bill.hearing || bill.hearings || bill.calendar || [];
    const today = new Date(); today.setHours(0,0,0,0);
    const upcoming = hearings
      .map(h => {
        const d = parseHearingDate(h.date || "");
        return { date: h.date || null, time: h.time || "", committee: h.description || h.committee || "", d };
      })
      .filter(h => h.d && h.d >= today)
      .sort((a, b) => a.d - b.d);
    hearingData[billId] = upcoming.length > 0
      ? { date: upcoming[0].date, time: upcoming[0].time, committee: upcoming[0].committee }
      : null;
    saveHearings();
    render();
  } catch(e) {
    hearingData[billId] = null;
    saveHearings();
  }
}

async function fetchAllHearings() {
  const toFetch = bills.filter(b => !hearingData.hasOwnProperty(b.id) && billIdMap[b.id]);
  if (!toFetch.length) return;
  setSyncStatus("syncing", `Fetching hearing dates (0/${toFetch.length})…`);
  let done = 0;
  for (let i = 0; i < toFetch.length; i += 3) {
    const chunk = toFetch.slice(i, i + 3);
    await Promise.all(chunk.map(b => fetchHearing(b.id)));
    done += chunk.length;
    setSyncStatus("syncing", `Fetching hearing dates (${done}/${toFetch.length})…`);
    if (i + 3 < toFetch.length) await new Promise(r => setTimeout(r, 600));
  }
  saveHearings();
  setSyncStatus("ok", `Live · hearings updated`);
  render();
}

function saveHearings() {
  try { localStorage.setItem(HEARING_KEY, JSON.stringify(hearingData)); } catch(e) {}
}

function loadHearings() {
  try { const r = localStorage.getItem(HEARING_KEY); if (r) hearingData = JSON.parse(r); } catch(e) {}
}

// ── Comments ──────────────────────────────────────────────────────────────────
function addComment(billId, text) {
  if (!text.trim()) return;
  if (!notesData[billId]) notesData[billId] = [];
  notesData[billId].push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2,6), text: text.trim(), ts: new Date().toISOString() });
  try { localStorage.setItem(NOTES_KEY, JSON.stringify(notesData)); } catch(e) {}
  render();
}

function deleteComment(billId, commentId) {
  if (!notesData[billId]) return;
  notesData[billId] = notesData[billId].filter(c => c.id !== commentId);
  if (!notesData[billId].length) delete notesData[billId];
  try { localStorage.setItem(NOTES_KEY, JSON.stringify(notesData)); } catch(e) {}
  render();
}

function loadNotes() {
  try { const r = localStorage.getItem(NOTES_KEY); if (r) notesData = JSON.parse(r); } catch(e) {}
}

function formatTs(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" })
    + " " + d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
}

function setSyncStatus(state, label) {
  document.getElementById("sync-dot").className = "sync-dot " + state;
  document.getElementById("sync-label").textContent = label;
}

function formatAge(ms) {
  const mins = Math.floor(ms / 60000), hrs = Math.floor(mins / 60);
  if (hrs > 0) return `${hrs}h ago`;
  if (mins > 0) return `${mins}m ago`;
  return "just now";
}

// Parse a more accurate status from last_action text when progress code is stale
function statusFromAction(lastAction, progressLabel, progressCls) {
  if (!lastAction) return { label: progressLabel, cls: progressCls };
  const a = lastAction;

  // Governor actions
  if (/chaptered by secretary of state/i.test(a))
    return { label: "Chaptered", cls: "b-signed" };
  if (/approved by the governor/i.test(a) || /signed by (the )?governor/i.test(a))
    return { label: "Signed by Governor", cls: "b-signed" };
  if (/vetoed by (the )?governor/i.test(a))
    return { label: "Vetoed", cls: "b-vetoed" };

  // Enrollment
  if (/enrolled and presented to the governor/i.test(a) || /enrolled/i.test(a))
    return { label: "Enrolled", cls: "b-engrossed" };

  // Failed / dead
  if (/failed (the )?passage/i.test(a))
    return { label: "Failed", cls: "b-inactive" };
  if (/died/i.test(a) || /\bdead\b/i.test(a))
    return { label: "Failed", cls: "b-inactive" };
  // Bills that didn't make it off the suspense file or out of committee by deadline
  if (/held under submission/i.test(a))
    return { label: "Failed – Suspense", cls: "b-inactive" };
  if (/from committee without further action/i.test(a))
    return { label: "Failed – Committee", cls: "b-inactive" };
  // "Not adopted" / "not passed" / "not concurred"
  if (/not adopted/i.test(a) || /not passed/i.test(a) || /not concurred/i.test(a))
    return { label: "Failed", cls: "b-inactive" };

  // Floor readings
  if (/read third time.*passed/i.test(a) || /passed.*third reading/i.test(a))
    return { label: "Passed – Third Reading", cls: "b-passed" };
  if (/read third time/i.test(a))
    return { label: "Floor – Third Reading", cls: "b-floor" };
  if (/read second time/i.test(a))
    return { label: "Floor – Second Reading", cls: "b-floor" };

  // Fall back to progress code
  return { label: progressLabel, cls: progressCls };
}


function effectiveStage(b) { return liveData[b.id] ? liveData[b.id].label : b.stage; }

// A bill is considered live-inactive if LegiScan says it's dead/failed/vetoed,
// OR if SANDAG flagged it inactive AND live data doesn't show it has moved forward
function liveIsInactive(b) {
  const s = effectiveStage(b).toLowerCase();
  if (s.includes("dead") || s.includes("failed") || s.includes("vetoed")) return true;
  // SANDAG inactive + no forward-moving live status = still inactive
  if (b.sandag === "Inactive") {
    const live = liveData[b.id];
    if (!live) return true;
    // If live shows something substantive (enrolled, chaptered, passed, floor) — not inactive
    if (s.includes("chaptered") || s.includes("signed") || s.includes("enrolled") ||
        s.includes("passed") || s.includes("floor") || s.includes("engrossed")) return false;
    return true;
  }
  return false;
}

// A bill is considered live-active if it has a live status and isn't inactive
function liveIsActive(b) {
  if (b.sandag === null) return false; // "Not in SANDAG" — neutral
  return !liveIsInactive(b);
}

const stageRank = s => {
  if (!s) return 5;
  const sl = s.toLowerCase();
  if (sl.includes("signed") || sl.includes("chaptered")) return 0;
  if (sl.includes("passed") || sl.includes("enrolled"))  return 1;
  if (sl.includes("engrossed") || sl.includes("floor"))  return 2;
  if (sl.includes("dead") || sl.includes("failed") || sl.includes("vetoed")) return 6;
  if (sl.includes("pending") || sl.includes("pre-filed")) return 4;
  return 3;
};

function chamberBadge(c) { return `<span class="badge ${c === "Senate" ? "b-senate" : "b-assembly"}">${c}</span>`; }
function catTag(k) { const c = CAT[k] || CAT.OTHER; return `<span class="cat ${c.cls}">${c.label}</span>`; }

function stageBadge(b) {
  if (b.sandag === null) return '<span class="badge b-notsandag">Not in SANDAG</span>';
  const live = liveData[b.id];
  const label = live ? live.label : b.stage;
  const cls   = live ? live.cls   : "b-committee";
  // Add a secondary "SANDAG: Inactive" indicator if SANDAG flagged it but live shows movement
  const sandagInactive = b.sandag === "Inactive" && !liveIsInactive(b);
  return `<span class="badge ${cls}">${label}</span>${sandagInactive ? ' <span class="badge" style="background:#FEF3C7;color:#92400E;font-size:10px">SANDAG: inactive</span>' : ''}`;
}

function liveRow(b) {
  const live = liveData[b.id];
  if (!live) return "";
  const dateStr = live.lastActionDate ? ` · ${live.lastActionDate}` : "";
  const action  = live.lastAction ? `<span class="live-date">${live.lastAction}${dateStr}</span>` : "";
  const link    = live.url ? ` <a class="live-link" href="${live.url}" target="_blank">leginfo ↗</a>` : "";
  return `<div class="live-row"><span class="live-pill">LIVE</span><span class="live-stage">${live.label}</span>${action}${link}</div>`;
}

function parseHearingDate(dateStr) {
  if (!dateStr) return null;
  let d = null;
  if (/^\d{4}-\d{2}-\d{2}$/.test(dateStr.trim())) {
    const [y,m,day] = dateStr.trim().split("-").map(Number);
    d = new Date(y, m-1, day);
  } else if (/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(dateStr.trim())) {
    const [m,day,y] = dateStr.trim().split("/").map(Number);
    d = new Date(y, m-1, day);
  } else { d = new Date(dateStr); }
  return (!d || isNaN(d.getTime())) ? null : d;
}

function hearingRow(b) {
  if (!hearingData.hasOwnProperty(b.id)) return "";
  const h = hearingData[b.id];
  if (!h || !h.date) return "";
  const hDate = parseHearingDate(h.date);
  if (!hDate) return "";
  const today = new Date(); today.setHours(0,0,0,0); hDate.setHours(0,0,0,0);
  const diff = Math.round((hDate - today) / 86400000);
  if (diff < 0) return "";
  let cls = "future", label = `IN ${diff}d`;
  if (diff === 0)     { cls = "today"; label = "TODAY"; }
  else if (diff <= 7) { cls = "soon"; }
  const dateStr = hDate.toLocaleDateString("en-US", { month:"short", day:"numeric", year:"numeric" });
  const timeStr = h.time ? ` · ${h.time}` : "";
  const cmte    = h.committee ? ` · ${h.committee}` : "";
  return `<div class="hearing-row"><span class="hearing-pill ${cls}">${label}</span><span class="hearing-date">${dateStr}${timeStr}</span><span class="hearing-cmte">${cmte}</span></div>`;
}

function notesRow(b) {
  const comments = notesData[b.id] || [];
  const logHtml = comments.map(c => `
    <div class="comment-entry">
      <div class="comment-meta">
        <span class="comment-author">Matt</span>
        <span class="comment-ts">${formatTs(c.ts)}</span>
        <button class="comment-delete" onclick="deleteComment('${b.id}','${escAttr(c.id)}')" title="Delete">✕</button>
      </div>
      <div class="comment-text">${escHtml(c.text)}</div>
    </div>`).join("");
  return `<div class="comments-section">
    ${comments.length ? `<div class="comments-log">${logHtml}</div>` : ""}
    <div class="comment-composer">
      <button class="comment-add-btn" id="comment-btn-${b.id}" onclick="openCommentBox('${b.id}')">＋ Add comment…</button>
      <div style="display:none;flex-direction:column;gap:5px" id="comment-box-${b.id}">
        <textarea class="comment-textarea" id="comment-ta-${b.id}" placeholder="Add a comment…" onkeydown="commentKeydown(event,'${b.id}')"></textarea>
        <div class="comment-actions">
          <button class="comment-post" onclick="postComment('${b.id}')">Post</button>
          <button class="comment-cancel-btn" onclick="closeCommentBox('${b.id}')">Cancel</button>
        </div>
      </div>
    </div>
  </div>`;
}

function escHtml(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function escAttr(s) { return String(s).replace(/'/g,"\\'"); }

function openCommentBox(billId) {
  document.getElementById("comment-btn-"+billId).style.display = "none";
  const box = document.getElementById("comment-box-"+billId);
  box.style.display = "flex"; box.style.flexDirection = "column"; box.style.gap = "5px";
  document.getElementById("comment-ta-"+billId).focus();
}
function closeCommentBox(billId) {
  document.getElementById("comment-box-"+billId).style.display = "none";
  document.getElementById("comment-btn-"+billId).style.display = "";
  document.getElementById("comment-ta-"+billId).value = "";
}
function postComment(billId) { const v = document.getElementById("comment-ta-"+billId).value; if (v.trim()) addComment(billId, v); }
function commentKeydown(e, billId) { if (e.key==="Enter" && (e.metaKey||e.ctrlKey)) { e.preventDefault(); postComment(billId); } }

// ── Filters ───────────────────────────────────────────────────────────────────

// Fixed single-select filters
const fixedFilters = [
  { label: "All",                  fn: () => true },
  { label: "Active",               fn: b => liveIsActive(b) },
  { label: "Inactive",             fn: b => liveIsInactive(b) },
  { label: "Not in SANDAG",        fn: b => b.sandag === null },
  { label: "Changed since SANDAG", fn: b => { const live = liveData[b.id]; return !!live && live.label !== b.stage; }},
  { label: "Has Hearing",          fn: b => hearingData.hasOwnProperty(b.id) && hearingData[b.id] !== null },
  { label: "Has Notes",            fn: b => !!(notesData[b.id] && notesData[b.id].length > 0) },
  { label: "Senate",               fn: b => b.chamber === "Senate" },
  { label: "Assembly",             fn: b => b.chamber === "Assembly" },
];

// Dynamic live-status filters — multi-select
let liveStatusFilters = [];
let activeFixedFilter = "All";       // single-select
let activeStatusLabels = new Set();  // multi-select live statuses

function buildLiveStatusFilters() {
  const seen = new Set();
  bills.forEach(b => {
    const live = liveData[b.id];
    if (live && live.label) seen.add(live.label);
  });

  const order = [
    "Chaptered","Signed by Governor","Signed","Enrolled",
    "Passed – Third Reading","Passed","Engrossed",
    "Floor – Third Reading","Floor – Second Reading",
    "In Committee","Introduced","Refer","Pre-Filed",
    "Failed","Vetoed","Dead",
  ];
  const sorted = [...seen].sort((a, b) => {
    const ai = order.findIndex(o => a === o || a.includes(o));
    const bi = order.findIndex(o => b === o || b.includes(o));
    if (ai === -1 && bi === -1) return a.localeCompare(b);
    if (ai === -1) return 1;
    if (bi === -1) return -1;
    return ai - bi;
  });

  liveStatusFilters = sorted.map(label => ({ label }));
}

function toggleStatusLabel(label) {
  if (activeStatusLabels.has(label)) {
    activeStatusLabels.delete(label);
  } else {
    activeStatusLabels.add(label);
    activeFixedFilter = "All"; // clear fixed filter when selecting a live status
  }
}

function setFixedFilter(label) {
  activeFixedFilter = label;
  activeStatusLabels.clear(); // clear live status selections
}

const catFilterOrder = ["SB79","DENSITY","STREAM","ADU","RHNA","FUNDING","OTHER"];
let currentCat = "All", searchVal = "";

function rebuildStatusFilters() {
  buildLiveStatusFilters();
  const bar = document.getElementById("status-filters");
  bar.innerHTML = "";

  // Fixed filters — single select
  fixedFilters.forEach(f => {
    const btn = document.createElement("button");
    btn.className = "fbtn" + (activeStatusLabels.size === 0 && f.label === activeFixedFilter ? " on" : "");
    btn.textContent = f.label;
    btn.dataset.group = "fixed";
    btn.onclick = () => { setFixedFilter(f.label); rebuildStatusFilters(); render(); };
    bar.appendChild(btn);
  });

  if (!liveStatusFilters.length) return;

  // Divider
  const div = document.createElement("span");
  div.className = "toolbar-divider"; div.style.margin = "0 2px";
  bar.appendChild(div);

  // Label
  const lbl = document.createElement("span");
  lbl.style.cssText = "font-size:11px;color:#999;white-space:nowrap;align-self:center;";
  lbl.textContent = "Status:";
  bar.appendChild(lbl);

  // Live status — multi-select
  liveStatusFilters.forEach(f => {
    const btn = document.createElement("button");
    const isOn = activeStatusLabels.has(f.label);
    btn.className = "fbtn" + (isOn ? " on" : "");
    btn.textContent = f.label;
    btn.dataset.group = "live";
    btn.onclick = () => { toggleStatusLabel(f.label); rebuildStatusFilters(); render(); };
    bar.appendChild(btn);
  });
}

function billPassesFilter(b) {
  // If live status filters are selected, only match those
  if (activeStatusLabels.size > 0) {
    const live = liveData[b.id];
    const stage = live ? live.label : b.stage;
    return activeStatusLabels.has(stage);
  }
  // Otherwise use the fixed filter
  const ff = fixedFilters.find(f => f.label === activeFixedFilter) || fixedFilters[0];
  return ff.fn(b);
}


function render() {
  const q = searchVal.toLowerCase();
  const usingLiveFilter = activeStatusLabels.size > 0;

  let displayed = bills.filter(b => {
    if (currentCat !== "All" && b.cat !== currentCat) return false;
    if (q && !(b.id.toLowerCase().includes(q) || b.subj.toLowerCase().includes(q) || b.desc.toLowerCase().includes(q))) return false;
    // Always apply the filter — hide non-matching bills regardless of filter type
    if (!billPassesFilter(b)) return false;
    return true;
  }).sort((a, b) => {
    const ra = a.sandag === "Inactive" ? 10 : a.sandag === null ? 5 : 0;
    const rb = b.sandag === "Inactive" ? 10 : b.sandag === null ? 5 : 0;
    if (ra !== rb) return ra - rb;
    return stageRank(effectiveStage(a)) - stageRank(effectiveStage(b));
  });

  const list = document.getElementById("bill-list");
  list.innerHTML = displayed.length === 0
    ? '<div class="no-results">No bills match your filters.</div>'
    : displayed.map(b => {
        const inactive   = liveIsInactive(b);
        const notSandag  = b.sandag === null;
        const live       = liveData[b.id];
        const changed    = live && live.label !== b.stage && !liveIsInactive(b);
        const hasNote    = !!(notesData[b.id] && notesData[b.id].length > 0);
        const hasHearing = hearingData.hasOwnProperty(b.id) && hearingData[b.id] !== null;
        return `<div class="bill-card${inactive?" is-inactive":""}${notSandag?" not-sandag":""}${changed?" live-changed":""}">
          <span class="bill-id">${b.id}${hasNote?'<span class="note-dot" title="Has notes"></span>':""}</span>
          <div class="bill-main">
            <div class="bill-top">
              <span class="bill-subj${inactive?" inactive-subj":""}">${b.subj}</span>
              ${catTag(b.cat)}
              ${hasHearing ? hearingRow(b) : ""}
            </div>
            ${liveRow(b)}
            <span class="bill-desc${notSandag?" no-desc":""}">${b.desc}</span>
            ${notesRow(b)}
          </div>
          <div class="bill-badges">${chamberBadge(b.chamber)}${stageBadge(b)}</div>
        </div>`;
      }).join("");

  const liveCount = Object.keys(liveData).length;
  document.getElementById("count-bar").textContent =
    `Showing ${displayed.length} of ${bills.length} bills · ${liveCount} with live LegiScan status`;
  updateStats();
}

function updateStats() {
  const active   = bills.filter(b => liveIsActive(b)).length;
  const inactive = bills.filter(b => liveIsInactive(b)).length;
  const notSan   = bills.filter(b => b.sandag === null).length;
  const enacted  = bills.filter(b => { const s = effectiveStage(b).toLowerCase(); return s.includes("chaptered")||s.includes("signed")||s.includes("enrolled"); }).length;
  const floor    = bills.filter(b => { const s = effectiveStage(b).toLowerCase(); return (s.includes("floor")||s.includes("passed")||s.includes("engrossed")) && !s.includes("chaptered") && !s.includes("signed") && !s.includes("enrolled"); }).length;
  document.getElementById("stats-bar").innerHTML = `
    <div class="stat"><div class="stat-n">${bills.length}</div><div class="stat-l">Total bills</div></div>
    <div class="stat"><div class="stat-n">${active}</div><div class="stat-l">Active</div></div>
    <div class="stat"><div class="stat-n">${inactive}</div><div class="stat-l">Inactive</div></div>
    <div class="stat"><div class="stat-n">${notSan}</div><div class="stat-l">Not in SANDAG</div></div>
    <div class="stat"><div class="stat-n">${floor}</div><div class="stat-l">On floor</div></div>
    <div class="stat" style="color:#145A32"><div class="stat-n" style="color:#145A32">${enacted}</div><div class="stat-l">Enacted</div></div>
  `;
}

// ── Build category filter buttons ─────────────────────────────────────────────
const catBar = document.getElementById("cat-filters");
const allCatBtn = document.createElement("button");
allCatBtn.className = "fbtn on"; allCatBtn.textContent = "All categories"; allCatBtn.dataset.group = "cat";
allCatBtn.onclick = () => { currentCat = "All"; document.querySelectorAll("[data-group='cat']").forEach(b => b.classList.toggle("on", b===allCatBtn)); render(); };
catBar.appendChild(allCatBtn);
catFilterOrder.forEach(key => {
  const btn = document.createElement("button");
  btn.className = "fbtn"; btn.textContent = CAT[key].label; btn.dataset.group = "cat";
  btn.onclick = () => { currentCat = key; document.querySelectorAll("[data-group='cat']").forEach(b => b.classList.toggle("on", b===btn)); render(); };
  catBar.appendChild(btn);
});

document.getElementById("search").addEventListener("input", e => { searchVal = e.target.value; render(); });

// ── Boot ──────────────────────────────────────────────────────────────────────
loadNotes();
loadHearings();
rebuildStatusFilters();
render();
syncAllBills();
</script>
</body>
</html>
